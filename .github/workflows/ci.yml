name: CI

on:
  push:
    branches: [main, ops-integration]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" ruff
      - run: ruff check .
      - run: python -m pytest -q

  e2e:
    name: Backend end-to-end (real NATS with the production permissions, Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16      # Postgres 16 + pgvector (production builds the same onto alpine)
        env:
          POSTGRES_DB: printfarm
          POSTGRES_USER: printfarm
          POSTGRES_PASSWORD: printfarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U printfarm -d printfarm" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NATS_SERVICES_PASSWORD: nservices-ci
      NATS_AGENTS_PASSWORD: nagents-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start NATS with infra/nats/nats.conf
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            -e NATS_SERVICES_PASSWORD -e NATS_AGENTS_PASSWORD \
            -v "$PWD/infra/nats/nats.conf:/etc/nats/nats.conf:ro" \
            nats:2.10.29-alpine -c /etc/nats/nats.conf
          for i in $(seq 1 30); do curl -fs "http://127.0.0.1:8222/healthz?js-enabled-only=true" && break; sleep 1; done
      - name: End-to-end test (agents connect as the restricted "agents" user)
        env:
          TEST_NATS_URL: nats://services:nservices-ci@127.0.0.1:4222
          TEST_NATS_AGENTS_URL: nats://agents:nagents-ci@127.0.0.1:4222
          TEST_DATABASE_URL: postgresql://printfarm:printfarm@127.0.0.1:5432/printfarm
        run: python -m pytest -q tests/test_e2e.py tests/test_hardening.py tests/test_users_pg.py tests/test_niches_pg.py tests/test_stock_pg.py tests/test_trend_pg.py tests/test_integrations_pg.py tests/test_production_pg.py
      - name: NATS log (permission violations show here)
        if: always()
        run: docker logs nats 2>&1 | tail -50

  web:
    name: Dashboard type check, tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vue-tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    env:   # placeholders: compose refuses to parse without them; nothing is started
      POSTGRES_PASSWORD: ci
      NATS_SERVICES_PASSWORD: nci
      NATS_AGENTS_PASSWORD: nci
      JWT_SECRET: ci-not-a-secret
      ADMIN_PASSWORD_HASH: ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --profile sim --profile p1a1 build
      - name: Backup self-test (dump -> age -> rclone -> download -> decrypt -> restore)
        run: |
          docker network create backup-test
          docker run -d --name backup-test-pg --network backup-test -e POSTGRES_USER=printfarm -e POSTGRES_PASSWORD=ci postgres:16.16-alpine
          docker build -t printfarm-backup infra/backup
          docker run --rm --network backup-test -e PGHOST=backup-test-pg -e PGPASSWORD=ci printfarm-backup selftest
