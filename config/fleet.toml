# REAL fleet. Used by Docker when .env contains FLEET_FILE=fleet.toml (the default is fleet.sim.toml).
# Printer ids must be lower case (a-z 0-9 _ -) and match the go2rtc stream names in infra/go2rtc/go2rtc.yaml.
# Give every printer a fixed IP (DHCP reservation) and check it with scripts/preflight.py first (README step 10).
# Access codes are never written here: access_code_env names an environment variable (cameras.env).

[fleet]
auto_clear_bed = false       # an operator confirms each cleared bed (`printfarm clear-bed <id>` or the dashboard)
max_plate_minutes = 480
edge_margin_mm = 5
part_spacing_mm = 4
schedule_interval_s = 15
batch_window_s = 3          # wait this long after new work so parts can share a plate

[safety]
pause_confirm_s = 10         # every pause must show up in the printer's own state within this time ...
pause_retries = 1            # ... else one more attempt, then a CRITICAL "pause unconfirmed" alert
start_confirm_s = 120        # a started plate must be reported as printing within this time, else it is failed
upload_timeout_s = 600       # one plate-file upload; P1-series FTPS can be slow (~1-2 MB/s)

[personalization]
font = "Noto Sans Hebrew:style=Bold"

# ---------------------------------------------------------------- printers
# Plate files: a printer receives only a SLICED plate file (Bambu: .gcode.3mf exported from the slicer with one
# sliced plate; Klipper: .gcode). Unsliced parts are refused with a clear reason until the plate compositor exists.
# Never set `simulated = true` here.

# Bambu Lab (LAN mode: MQTT over TLS on 8883, implicit FTPS on 990 for uploads). Uncomment and fill in:
# [[printers]]
# id = "x1c-02"
# vendor = "bambu"
# model = "x1"                        # x1 | p1 | a1 (informational; cameras are set up in go2rtc.yaml)
# host = "192.168.50.21"
# port = 8883
# tls = true
# serial = "00M00A000000000"          # printer screen > Settings > Device
# access_code_env = "BAMBU_CODE_X1C_02"
# ftp_port = 990
# print_url = "ftp:///{file}"         # project_file "url"; verify on your firmware before relying on it
# use_ams = false
# bed_mm = [256, 256]
# nozzle_mm = 0.4
# material = "PLA"
# color = "black"
# Before the first real print, check that the printer accepts third-party control (pause!) on your firmware;
# newer firmware may need LAN-only mode + Developer Mode. The pause check raises an alert if it does not.

# Klipper / Moonraker (WebSocket + HTTP API on the same host:port):
# [[printers]]
# id = "voron-01"
# vendor = "moonraker"
# model = "klipper"
# url = "ws://192.168.50.31:7125/websocket"
# api_key_env = ""                    # only if Moonraker requires an API key (env var name, in cameras.env)
# bed_mm = [300, 300]
# nozzle_mm = 0.4
# material = "PLA"
# color = "black"

# ---------------------------------------------------------------- materials & reorder policy
[[materials]]
material = "PLA"
color = "black"
grams_per_spool = 1000
cost_per_spool_agorot = 8500  # 85.00 ILS gross
lead_time_days = 5
safety_stock_days = 3
baseline_daily_grams = 150
auto_approve_limit_agorot = 20000    # reorders above 200.00 ILS need a human approval
min_stock_grams = 1000               # dashboard alert below this; the reorder rule keeps stock above it
reorder_mode = "auto"                # "manual": every reorder waits for your approval
supplier = "Bambu Store"

[[materials]]
material = "PLA"
color = "white"
grams_per_spool = 1000
cost_per_spool_agorot = 8500  # 85.00 ILS gross
lead_time_days = 5
safety_stock_days = 3
baseline_daily_grams = 100
auto_approve_limit_agorot = 20000
