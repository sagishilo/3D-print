# REAL fleet. Used by Docker when .env contains FLEET_FILE=fleet.toml (the default is fleet.sim.toml).
# Printer ids must be lower case (a-z 0-9 _ -) and match the go2rtc stream names in infra/go2rtc/go2rtc.yaml.
# Give every printer a fixed IP (DHCP reservation) and check it with scripts/preflight.py first (README step 10).
# Access codes are never written here: access_code_env names an environment variable (cameras.env).

[fleet]
auto_clear_bed = false       # an operator confirms each cleared bed (`printfarm clear-bed <id>` or the dashboard)
max_plate_minutes = 480
edge_margin_mm = 5
part_spacing_mm = 4
schedule_interval_s = 15
batch_window_s = 3          # wait this long after new work so parts can share a plate

[safety]
pause_confirm_s = 10         # every pause must show up in the printer's own state within this time ...
pause_retries = 1            # ... else one more attempt, then a CRITICAL "pause unconfirmed" alert
start_confirm_s = 120        # a started plate must be reported as printing within this time, else it is failed
upload_timeout_s = 600       # one plate-file upload; P1-series FTPS can be slow (~1-2 MB/s)

[personalization]
font = "Noto Sans Hebrew:style=Bold"

# ---------------------------------------------------------------- printers
# Plate files: a printer receives only a SLICED plate file (Bambu: .gcode.3mf exported from the slicer with one
# sliced plate; Klipper: .gcode). Unsliced parts are refused with a clear reason until the plate compositor exists.
# Never set `simulated = true` here.

# ---- Your farm: Bambu Lab A1 + AMS Lite, and Bambu Lab A1 mini (README "Connecting the real printers") ----------
# To use: remove the leading "# " of every line between the >>> and <<< markers (lines starting "##" stay comments),
# then replace each <...> placeholder. Bed size, build height and average watts come from `model`.
# On each printer: Settings > LAN Only Mode ON, then Developer Mode ON (third-party control), note the 8-character
# access code (same screen) and the serial number (Settings > Device). Reserve each IP on your router (DHCP).

# >>> bambu-a1
# [[printers]]
# id = "bambu-a1"                     ## also its camera stream name (go2rtc.yaml) and BAMBU_CAMS entry (cameras.env)
# vendor = "bambu"
# model = "a1"                        ## 256 x 256 x 256 mm, ~95 W; only files sliced for the A1 go to it
# host = "<A1 LAN IP, e.g. 192.168.1.41>"
# serial = "<A1 serial, 15 characters, Settings > Device>"
# access_code_env = "BAMBU_CODE_BAMBU_A1"   ## the code itself goes in cameras.env, never here
# print_url = "file:///sdcard/{file}" ## A1 series: the uploaded file on the SD card (community-documented)
# nozzle_mm = 0.4
# ams_slots = 4                       ## one AMS Lite: multi-colour files only ever go to this printer
# ams_filaments = ["PLA/black", "PLA/white", "PLA/red", "PLA/blue"]   ## what is in slots 1-4 now; edit when you swap
# initial_print_hours = 1116          ## the printer's own counter (Settings > Device > print hours)
# # maintenance_done_hours = { lube-rods = 1100, nozzle-check = 1100 }  ## optional: print hours at the last service
# <<< bambu-a1

# >>> bambu-a1-mini
# [[printers]]
# id = "bambu-a1-mini"
# vendor = "bambu"
# model = "a1-mini"                   ## 180 x 180 x 180 mm, ~80 W; larger or taller parts never go to it
# host = "<A1 mini LAN IP, e.g. 192.168.1.42>"
# serial = "<A1 mini serial, 15 characters>"
# access_code_env = "BAMBU_CODE_BAMBU_A1_MINI"
# print_url = "file:///sdcard/{file}"
# nozzle_mm = 0.4
# material = "PLA"                    ## the one external spool on it now
# color = "black"
# initial_print_hours = 497
# <<< bambu-a1-mini

# Any other Bambu Lab printer (LAN mode: MQTT over TLS on 8883, implicit FTPS on 990 for uploads):
# [[printers]]
# id = "x1c-02"
# vendor = "bambu"
# model = "x1c"                       # a1 | a1-mini | p1p | p1s | x1c | x1e: fills bed, height and watts
# host = "192.168.50.21"
# port = 8883
# tls = true
# serial = "00M00A000000000"          # printer screen > Settings > Device
# access_code_env = "BAMBU_CODE_X1C_02"
# ftp_port = 990
# print_url = "ftp:///{file}"         # project_file "url"; verify on your firmware before relying on it
# use_ams = false
# watts = 110                        # average power while printing (electricity cost per plate); omit = finance default
# bed_mm = [256, 256, 256]            # width, depth, height; omit to take the model's
# nozzle_mm = 0.4
# material = "PLA"
# color = "black"
# Before the first real print, check that the printer accepts third-party control (pause!) on your firmware;
# newer firmware may need LAN-only mode + Developer Mode. The pause check raises an alert if it does not.

# Klipper / Moonraker (WebSocket + HTTP API on the same host:port):
# [[printers]]
# id = "voron-01"
# vendor = "moonraker"
# model = "klipper"
# url = "ws://192.168.50.31:7125/websocket"
# api_key_env = ""                    # only if Moonraker requires an API key (env var name, in cameras.env)
# watts = 150                        # average power while printing; omit = finance default
# bed_mm = [300, 300]
# nozzle_mm = 0.4
# material = "PLA"
# color = "black"

# ---------------------------------------------------------------- materials & reorder policy
[[materials]]
material = "PLA"
color = "black"
grams_per_spool = 1000
cost_per_spool_agorot = 8500  # 85.00 ILS gross
lead_time_days = 5
safety_stock_days = 3
baseline_daily_grams = 150
auto_approve_limit_agorot = 20000    # reorders above 200.00 ILS need a human approval
min_stock_grams = 1000               # dashboard alert below this; the reorder rule keeps stock above it
reorder_mode = "auto"                # "manual": every reorder waits for your approval
supplier = "Bambu Store"

[[materials]]
material = "PLA"
color = "white"
grams_per_spool = 1000
cost_per_spool_agorot = 8500  # 85.00 ILS gross
lead_time_days = 5
safety_stock_days = 3
baseline_daily_grams = 100
auto_approve_limit_agorot = 20000
