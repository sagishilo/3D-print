# SIMULATED fleet, used by the agents and the simulator in Docker (docker compose --profile sim ...).
# This is the default (FLEET_FILE unset). Your real printers go in fleet.toml; select it with FLEET_FILE=fleet.toml in .env.

[fleet]
auto_clear_bed = true        # DEV ONLY. In production an operator runs `printfarm clear-bed <id>`.
max_plate_minutes = 480
edge_margin_mm = 5
part_spacing_mm = 4
schedule_interval_s = 15
batch_window_s = 3          # wait this long after new work so parts can share a plate

[simulator]
print_seconds = 20           # simulated duration of every plate

[safety]
pause_confirm_s = 10         # each pause must show up in the printer's own state within this time
pause_retries = 1            # one more pause attempt, then a critical "pause unconfirmed" alert
start_confirm_s = 120        # a started plate must be reported as printing within this time
upload_timeout_s = 600

[personalization]
font = "Noto Sans Hebrew:style=Bold"

# ---------------------------------------------------------------- printers
# simulated = true lets the simulator take placeholder plate files; NEVER set it for a real printer.
# The simulator container serves every printer's FTPS / camera ports itself, so they differ per printer here;
# a real printer uses its own IP with ftp_port 990 and camera port 6000.
[[printers]]
id = "bambu-01"
vendor = "bambu"
model = "p1"
simulated = true
host = "mosquitto"           # real printer: its LAN IP, port 8883, tls = true
port = 1883
tls = false
serial = "SIM00000000001"
access_code_env = "SIM_ACCESS_CODE"   # real printer: e.g. "BAMBU_CODE_P1S_01" (in cameras.env)
ftp_host = "simulator"
ftp_port = 9901
camera_port = 6001
bed_mm = [256, 256]
nozzle_mm = 0.4
material = "PLA"
color = "black"

[[printers]]
id = "bambu-02"
vendor = "bambu"
model = "x1"                 # camera: native RTSPS (the x1-camera-sim service), not the port-6000 protocol
simulated = true
host = "mosquitto"
port = 1883
tls = false
serial = "SIM00000000002"
access_code_env = "SIM_ACCESS_CODE"
ftp_host = "simulator"
ftp_port = 9902
camera_port = 6002
bed_mm = [256, 256]
nozzle_mm = 0.4
material = "PLA"
color = "white"

[[printers]]
id = "voron-01"
vendor = "moonraker"
model = "klipper"
simulated = true
url = "ws://simulator:7125/websocket"   # HTTP API, uploads and the webcam share this host:port
bed_mm = [300, 300]
nozzle_mm = 0.4
material = "PLA"
color = "black"

# ---------------------------------------------------------------- materials & reorder policy
[[materials]]
material = "PLA"
color = "black"
grams_per_spool = 1000
cost_per_spool_agorot = 8500  # 85.00 ILS gross
lead_time_days = 5
safety_stock_days = 3
baseline_daily_grams = 150
auto_approve_limit_agorot = 20000    # reorders above 200.00 ILS need a human approval
min_stock_grams = 1000               # dashboard alert below this; the reorder rule keeps stock above it
reorder_mode = "auto"                # "manual": every reorder waits for your approval
supplier = "Bambu Store"

[[materials]]
material = "PLA"
color = "white"
grams_per_spool = 1000
cost_per_spool_agorot = 8500  # 85.00 ILS gross
lead_time_days = 5
safety_stock_days = 3
baseline_daily_grams = 100
auto_approve_limit_agorot = 20000
min_stock_grams = 1000
reorder_mode = "manual"
supplier = "Bambu Store"

