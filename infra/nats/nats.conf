# NATS JetStream for PrintFarm Ops
server_name: printfarm
port: 4222
http_port: 8222            # monitoring (/healthz, /varz, /jsz); published on 127.0.0.1 only

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 5GB
}

# Two users; passwords come from the environment (.env).
#   services: the gateway and the operator CLI. Full access: it publishes operator commands after login, CSRF
#             and the audit log, and replays or discards dead letters.
#   agents:   the agent containers. Events, telemetry, dead letters, query replies, the JetStream/KV/object store
#             APIs, and only the commands one agent sends another. Operator commands (approve, pay, cancel,
#             settings...) are refused, and so are stream deletes and purges.
# The agents' lists mirror src/printfarm/contracts/permissions.py; tests/test_hardening.py keeps them equal.
authorization {
  users = [
    { user: "services", password: $NATS_SERVICES_PASSWORD }
    {
      user: "agents"
      password: $NATS_AGENTS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.>", "tlm.>", "dlq.>", "qry.>", "_INBOX.>",
            "$JS.API.>", "$JS.ACK.>", "$JS.FC.>", "$KV.>", "$O.>",
            "cmd.personalization.generate_nameplate",
            "cmd.personalization.prepare_catalog_item",
            "cmd.fleet.enqueue_job",
            "cmd.fleet.cancel_jobs",
            "cmd.telemetry.start_print"
          ]
          deny: [
            "$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>", "$JS.API.STREAM.MSG.DELETE.>"
          ]
        }
        subscribe: { allow: [">"] }
      }
    }
  ]
}

max_payload: 2MB
