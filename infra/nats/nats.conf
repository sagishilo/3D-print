# NATS JetStream for PrintFarm Ops
server_name: printfarm
port: 4222
http_port: 8222            # monitoring (/healthz, /varz, /jsz); published on 127.0.0.1 only

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 5GB
}

# Two users: services (full access) and agents. Passwords come from the environment.
authorization {
  users = [
    { user: "services", password: $NATS_SERVICES_PASSWORD }
    { user: "agents",   password: $NATS_AGENTS_PASSWORD }
  ]
}

max_payload: 2MB
