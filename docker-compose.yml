# PrintFarm Ops: local stack (NATS JetStream, PostgreSQL, FastAPI gateway, go2rtc, Caddy HTTPS)
# plus the agents (coordinator, personalization, fleet, inventory, telemetry, finance = the ledger).
#
# Start:            docker compose up -d --build
# With simulators:  docker compose --profile sim up -d --build      (no real printers needed)
# P1/A1 cameras:    add --profile p1a1
# CLI:              docker compose run --rm cli status
#
# Only Caddy (80/443) is reachable from the LAN. Everything else is bound to 127.0.0.1 or internal.

name: printfarm

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-restart: &restart unless-stopped

# One image for every agent (built from ./Dockerfile); one container per agent so each can be
# restarted or resource-limited on its own.
x-agent: &agent
  build: .
  environment: &agent-env
    NATS_URL: nats://agents:${NATS_AGENTS_PASSWORD:?set in .env}@nats:4222
    DATABASE_URL: postgresql://printfarm:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/printfarm
    # fleet.sim.toml = simulated printers (use with --profile sim); fleet.toml = your real printers
    FLEET_CONFIG: /app/config/${FLEET_FILE:-fleet.sim.toml}
    ARTIFACT_DIR: /app/var/artifacts
    LOG_LEVEL: INFO
    # LAN access code of the SIMULATED printers (fleet.sim.toml). Not a secret: real codes live in cameras.env.
    SIM_ACCESS_CODE: "12345678"
  volumes:
    - artifacts:/app/var/artifacts
    - ./config:/app/config:ro
  depends_on: &agent-deps
    nats: { condition: service_healthy }
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  restart: *restart
  logging: *logging

services:
  nats:
    image: nats:2.10.29-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_SERVICES_PASSWORD: ${NATS_SERVICES_PASSWORD:?set in .env}
      NATS_AGENTS_PASSWORD: ${NATS_AGENTS_PASSWORD:?set in .env}
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"   # agents running on this PC connect here
      - "127.0.0.1:8222:8222"   # monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: *restart
    logging: *logging

  postgres:
    build: ./infra/postgres          # postgres:16.16-alpine + pgvector (the social agent's embeddings)
    image: printfarm-postgres:16-pgvector
    environment:
      POSTGRES_DB: printfarm
      POSTGRES_USER: printfarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data          # tables are created by the one-shot "migrate" service
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printfarm -d printfarm"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: *restart
    logging: *logging

  # Nightly pg_dump into ./backups (keeps 14). Copy that folder off this PC now and then.
  # One now: docker compose run --rm backup now   ·  restore: see infra/backup/backup.sh
  backup:
    build: infra/backup                 # postgres:16.16-alpine + age (encryption) + rclone (cloud storage)
    command: ["loop"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      BACKUP_INTERVAL_S: ${BACKUP_INTERVAL_S:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Encrypted off-site copies (README "Off-site backups"); both empty = local backups only.
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}                     # an rclone remote, e.g. gdrive:printfarm-backups
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}       # PUBLIC key (age1...); the private key stays off this PC
      BACKUP_OFFSITE_KEEP_DAYS: ${BACKUP_OFFSITE_KEEP_DAYS:-90}
    volumes:
      - ./backups:/backups
      - ./backup-offsite:/config/rclone                  # rclone.conf (cloud login), never committed
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:   # unhealthy when the last good backup is older than two intervals
      test: ["CMD", "/bin/sh", "/backup.sh", "check"]
      interval: 10m
      timeout: 5s
      start_period: 5m
      retries: 1
    restart: *restart
    logging: *logging

  go2rtc:
    image: alexxit/go2rtc:1.9.15
    env_file:                                         # printer access codes only, referenced as ${...} in go2rtc.yaml
      - path: cameras.env
        required: false
    volumes:
      - ./infra/go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "127.0.0.1:1984:1984"   # go2rtc web UI for testing streams, this PC only
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1984/api"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: *restart
    logging: *logging

  bambu-cam:                    # P1/A1 frame-reader; only with: --profile p1a1
    profiles: ["p1a1"]
    build: ./bambu-cam
    env_file:                   # BAMBU_CAMS + BAMBU_CODE_<ID> access codes
      - path: cameras.env
        required: false
    restart: *restart
    logging: *logging

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql://printfarm:${POSTGRES_PASSWORD}@postgres:5432/printfarm
      NATS_URL: nats://services:${NATS_SERVICES_PASSWORD}@nats:4222
      GO2RTC_URL: http://go2rtc:1984
      NATS_MONITOR_URL: http://nats:8222     # System screen: connections, message rates, JetStream totals
      # Browser origins allowed to open the live feed (/ws): https://<each SITE_HOSTS entry> + EXTRA_ORIGINS
      SITE_HOSTS: ${SITE_HOSTS:-localhost}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?run scripts/init_env.py}
      COOKIE_SECURE: "true"
      RATE_API_PER_MIN: ${RATE_API_PER_MIN:-600}   # reads per minute per computer (the browser tests need more)
    volumes:
      - ./backups:/backups:ro                # only status.json is read (System: backup status)
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }   # gateway.* tables
      go2rtc: { condition: service_started }
    restart: *restart
    logging: *logging

  # HTTPS front door + the dashboard (built from web/ into the image: caddy 2.11.9 + the Vue build).
  caddy:
    build:
      context: ./web
      additional_contexts:
        docs: ./docs              # docs/USER_GUIDE_HE.md, shown in the dashboard at /help
    environment:
      SITE_HOSTS: ${SITE_HOSTS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data         # holds the local CA; keep it, or every device must re-trust a new one
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      gateway: { condition: service_healthy }
    restart: *restart
    logging: *logging

  # ------------------------------------------------------------------ agents
  # Applies src/printfarm/store/migrations once, then exits; every agent waits for it.
  migrate:
    build: .
    command: ["migrate"]
    environment: *agent-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging

  coordinator:
    <<: *agent
    command: ["agent", "coordinator"]

  personalization:
    <<: *agent
    command: ["agent", "personalization"]

  fleet:
    <<: *agent
    command: ["agent", "fleet"]

  inventory:
    <<: *agent
    command: ["agent", "inventory"]

  finance:                      # the ledger: income, expenses, VAT, per-job cost allocation
    <<: *agent
    command: ["agent", "finance"]

  # Social Listening (ADR-0007): scores posts people captured, drafts replies people approve and post themselves.
  # The only service that gets the Claude API key; without one, captures are kept and wait.
  social:
    <<: *agent
    command: ["agent", "social"]
    environment:
      <<: *agent-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SOCIAL_CONFIG: /app/config/social.toml
      SOCIAL_LLM: ${SOCIAL_LLM:-}         # "fake" = test mode: keyword triage, canned drafts, no Claude calls

  trend:
    <<: *agent
    command: ["agent", "trend"]
    environment:
      <<: *agent-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TREND_LLM: ${TREND_LLM:-}           # "fake" = test mode: the insight from the numbers, no Claude calls
      TREND_INTERVAL_S: ${TREND_INTERVAL_S:-3600}

  # Wave 2: every outside service (stores, invoicing, couriers, alert channels). Outbound polling only; its secrets
  # come from integrations.env (gitignored; see integrations.env.example and scripts/check_integrations_env.py).
  integrations:
    <<: *agent
    command: ["agent", "integrations"]
    env_file:
      - path: integrations.env
        required: false

  telemetry:
    <<: *agent
    command: ["agent", "telemetry"]
    environment:
      <<: *agent-env
      # Camera failure detection (W2-C): off | fake (demo and tests, scores from VISION_FAKE_SCORES) | http (a model
      # on this network at VISION_MODEL_URL). It also needs the vision.enabled setting (System > Automation).
      VISION_MODEL: ${VISION_MODEL:-off}
      VISION_MODEL_URL: ${VISION_MODEL_URL:-}
      VISION_FAKE_SCORES: ${VISION_FAKE_SCORES:-}
      GO2RTC_URL: http://go2rtc:1984
    # The only service that talks to printers: it needs the LAN access codes (fleet.toml access_code_env).
    env_file:
      - path: cameras.env
        required: false

  # ------------------------------------------------------------------ simulators (dev, no printers needed)
  # Stands in for the MQTT broker that every real Bambu printer runs itself.
  mosquitto:
    profiles: ["sim"]
    image: eclipse-mosquitto:2
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: *restart
    logging: *logging

  # Simulated printers: two Bambu P1 (MQTT via mosquitto, FTPS on 9901/9902, port-6000-style cameras on 6001/6002)
  # and a Klipper/Moonraker printer (HTTP + WebSocket + Crowsnest webcam on simulator:7125).
  # Inject failures: SIM_FAULTS="voron-01=thermal_runaway,bambu-02=ignore_pause+camera_drop" docker compose --profile sim up -d simulator
  simulator:
    <<: *agent
    profiles: ["sim"]
    command: ["sim"]
    environment:
      <<: *agent-env
      SIM_FAULTS: ${SIM_FAULTS:-}
    depends_on:
      mosquitto: { condition: service_started }

  # The P1/A1 frame-reader pointed at the simulated P1 (the real one, bambu-cam, uses cameras.env).
  bambu-cam-sim:
    profiles: ["sim"]
    build: ./bambu-cam
    environment:
      BAMBU_CAMS: bambu-01=simulator:6001
      BAMBU_CODE_BAMBU_01: "12345678"
    restart: *restart
    logging: *logging

  # The simulated X1's native camera: RTSPS on :322, user bblp + access code, path streaming/live/1.
  x1-camera-sim:
    profiles: ["sim"]
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    volumes:
      - ./infra/sim/mediamtx-x1.yml:/mediamtx.yml:ro
      - ./src/printfarm/simulator/assets/sim-printer.pem:/certs/sim-printer.pem:ro
    restart: *restart
    logging: *logging

  # Operator CLI: docker compose run --rm cli <order|approvals|approve|clear-bed|status|watch|reset-data>
  # It sends operator commands (approve, clear bed, orders), so it connects as "services", not "agents".
  cli:
    <<: *agent
    profiles: ["tools"]
    environment:
      <<: *agent-env
      NATS_URL: nats://services:${NATS_SERVICES_PASSWORD:?set in .env}@nats:4222
    restart: "no"

volumes:
  nats-data:
  pg-data:
  caddy-data:
  caddy-config:
  artifacts:
