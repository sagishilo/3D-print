[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printfarm"
version = "0.1.0"
description = "Multi-agent orchestration platform for a 3D printing business"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "nats-py>=2.7",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "aiomqtt>=2.0",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "amqtt>=0.11"]

[project.scripts]
printfarm = "printfarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
printfarm = ["store/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
