[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printfarm"
version = "0.3.0"
description = "Multi-agent orchestration platform for a 3D printing business"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "nats-py>=2.7",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "aiomqtt>=2.0",
    "websockets>=12",
    "httpx>=0.27",               # Moonraker HTTP file upload
    "tzdata>=2024.1",            # IANA time zones for zoneinfo on Windows and slim images (ledger days)
]

[project.optional-dependencies]
# Social Listening (phase 10): Claude API + local multilingual embeddings (ONNX, CPU)
social = ["anthropic>=2.8,<3", "fastembed>=0.9.1,<0.10"]
dev = [
    "pytest>=8", "pytest-asyncio>=0.23",
    "amqtt>=0.11",               # in-process MQTT broker for tests/test_e2e.py (or set TEST_MQTT_URL)
    # gateway tests (tests/test_gateway.py)
    "fastapi>=0.110", "httpx>=0.27", "pyjwt>=2.8", "argon2-cffi>=23.1", "pydantic-settings>=2.2",
    "anthropic>=2.8,<3",         # social agent tests (the client is faked; no network)
    "openpyxl==3.1.5",           # gateway Excel exports (tests open the file)
]

[project.scripts]
printfarm = "printfarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
printfarm = ["store/migrations/*.sql", "simulator/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]   # FastAPI's dependency idiom, not a mutable default
